name: Repair chat conversation resume

on:
  push:
    branches:
      - fix/chat-conversation-resume

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-conversation-resume
          fetch-depth: 0

      - name: Patch chat resume and home titles
        run: python3 .github/scripts/repair_chat_resume.py

      - name: Verify patch markers
        run: |
          grep -n "requestedConversationId" apps/miniapp/src/app/chat/page.tsx
          grep -n "bootstrap:resumeConversation" apps/miniapp/src/app/chat/page.tsx
          grep -n "resolveConversationTitle" apps/miniapp/src/app/home/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build miniapp
        run: npm run build --workspace=apps/miniapp

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/miniapp/src/app/chat/page.tsx apps/miniapp/src/app/home/page.tsx
          git commit -m "fix: restore chat conversation resume"
          git push origin HEAD:fix/chat-conversation-resume
